<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Bookora</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link href="/static/styles.css" rel="stylesheet">
    <link href="/static/signin-modal.css" rel="stylesheet">
    <link href="/static/profile-styles.css" rel="stylesheet">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-bookora">
        <div class="container-fluid" style="padding: 0 2rem;">
            <a class="navbar-brand" href="/">Bookora</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <div class="city-display">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Ahmedabad, Gujarat</span>
                        </div>
                    </li>
                    
                    <!-- Profile Section (shown when logged in) -->
                    <li class="nav-item profile-section" style="display: none;">
                        <div class="profile-container">
                            <div class="profile-avatar" onclick="toggleProfileDropdown()">
                                <i class="fas fa-user-circle"></i>
                            </div>
                            <div class="profile-dropdown" id="profileDropdown">
                                <div class="profile-dropdown-header">
                                    <div class="profile-name" id="profileDisplayName">User</div>
                                    <div class="profile-contact" id="profileDisplayContact"></div>
                                </div>
                                <div class="profile-dropdown-divider"></div>
                                <a href="/profile" class="profile-dropdown-item active">
                                    <i class="fas fa-user"></i> My Profile
                                </a>
                                <a href="/my-bookings" class="profile-dropdown-item">
                                    <i class="fas fa-ticket-alt"></i> My Bookings
                                </a>
                                <a href="/saved-movies" class="profile-dropdown-item">
                                    <i class="fas fa-heart"></i> Saved Movies
                                </a>
                                <div class="profile-dropdown-divider"></div>
                                <a href="#" class="profile-dropdown-item logout-item" onclick="handleLogout(event)">
                                    <i class="fas fa-sign-out-alt"></i> Logout
                                </a>
                            </div>
                        </div>
                    </li>
                    
                    <!-- Auth Buttons (shown when not logged in) -->
                    <li class="nav-item auth-buttons">
                        <button class="btn btn-login" onclick="openSignInModal()">Sign In</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <!-- Profile Content -->
    <div class="profile-container-main">
        <div class="profile-header">
            <h1>My Profile</h1>
            <p>Manage your personal information</p>
        </div>
        
        <div class="profile-card">
            <div class="profile-form">
                <div class="form-row">
                    <label for="userName">Name</label>
                    <div class="form-input-group">
                        <input type="text" id="userName" class="form-control" readonly>
                        <button class="btn-edit" id="editBtn" onclick="enableEdit()">
                            <i class="fas fa-pencil-alt"></i> Edit Profile
                        </button>
                    </div>
                </div>
                
                <div class="form-row">
                    <label for="userEmail">Email</label>
                    <div class="form-input-group">
                        <input type="email" id="userEmail" class="form-control" readonly disabled>
                        <span class="readonly-label">Read-only</span>
                    </div>
                </div>
                
                <div class="form-row">
                    <label id="phoneLabel">Phone Number</label>
                    <div class="form-input-group">
                        <input type="tel" id="userPhone" class="form-control" readonly>
                        <span class="readonly-label" id="phoneReadonlyLabel" style="display: none;">Read-only</span>
                    </div>
                </div>
                
                <div class="form-actions" id="formActions" style="display: none;">
                    <button class="btn-save" onclick="saveChanges()">
                        <i class="fas fa-check"></i> Save Changes
                    </button>
                    <button class="btn-cancel" onclick="cancelEdit()">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                </div>
                
                <div id="messageBox" class="message-box"></div>
            </div>
        </div>
    </div>
    
    <!-- Sign-In Modal -->
    <div class="modal-overlay" id="signinModal">
        <div class="signin-modal">
            <button class="modal-close" onclick="closeSignInModal()">
                <i class="fas fa-times"></i>
            </button>
            
            <div class="modal-header">
                <h2>Get Started</h2>
                <p>Sign in to book your favorite movies</p>
            </div>
            
            <div id="modalContent">
                <!-- Dynamic content loaded by signin-modal.js -->
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/signin-modal.js"></script>
    <script src="/static/profile-script.js"></script>
</body>
</html>
